name: Deploy GitHub Pages (frontend)

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "bookmarklet/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.final_deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        if: ${{ vars.PAGE_URL == '' }}
        uses: actions/configure-pages@v5

      - name: Save GitHub Pages URL
        if: ${{ vars.PAGE_URL == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: gh variable set PAGE_URL --body "$PAGE_URL"

      - name: Build bookmarklet URL and inject into frontend
        env:
          PAGE_URL: ${{ vars.PAGE_URL || steps.pages.outputs.base_url }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const terser = require('terser');

          (async () => {
            const pageUrl = process.env.PAGE_URL;
            if (!pageUrl) {
              throw new Error('PAGE_URL is empty');
            }

            const codexJsPath = 'bookmarklet/codex.js';
            const htmlPath = 'frontend/index.html';

            const codexJs = fs.readFileSync(codexJsPath, 'utf8');
            const codexJsWithBaseUrl = codexJs.replaceAll("__BASE_URL__", JSON.stringify(pageUrl));

            const minified = await terser.minify(codexJsWithBaseUrl, {
              compress: { inline: false, sequences: false, join_vars: false },
              mangle: false,
            });

            if (!minified.code) {
              throw new Error('Terser returned empty output');
            }

            const bookmarkletUrl = 'javascript:' + minified.code.replaceAll('%', '%25').replaceAll('"', '%22').replaceAll("\\", "%5C");

            const html = fs.readFileSync(htmlPath, 'utf8');
            fs.writeFileSync(htmlPath, html.replaceAll('__CODEX_BOOKMARKLET_URL__', JSON.stringify(bookmarkletUrl)));
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: final_deployment
        uses: actions/deploy-pages@v4
