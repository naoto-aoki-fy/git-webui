# When a repository name starts with a prefix (case-insensitive), pushes are
# repeated to destination_owner/<name-with-prefix-removed>. The destination
# owner is also the default Git author, and Repository B is prefilled in sync
# mode. The first matching pair wins.
repository_prefix_destinations = [
  ["upstream-", "destination-owner"],
]

